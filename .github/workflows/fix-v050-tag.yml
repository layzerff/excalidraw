name: Correct v0.5.0 source tag once
on:
  push:
    paths:
      - .github/workflows/fix-v050-tag.yml
permissions:
  contents: write
jobs:
  correct-tag:
    if: github.repository == 'layzerff/excalidraw' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact commits and correct only v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          old=2b304f00586c5cc3cd45203e37139a4f9f91fe46
          new=f3fc0d4366cb12e64c4f757eab458fab38ff5353
          actual=$(gh api repos/layzerff/excalidraw/git/ref/tags/v0.5.0 --jq .object.sha)
          test "$actual" = "$old"
          source=$(gh api repos/layzerff/excalidraw/git/ref/heads/codex/local-canvas-p0 --jq .object.sha)
          test "$source" = "$new"
          gh api --method PATCH repos/layzerff/excalidraw/git/refs/tags/v0.5.0 -f sha="$new" -F force=true
          test "$(gh api repos/layzerff/excalidraw/git/ref/tags/v0.5.0 --jq .object.sha)" = "$new"
