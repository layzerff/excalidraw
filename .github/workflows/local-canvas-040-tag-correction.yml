name: Correct Local Canvas 0.4.0 tag
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local-canvas-040-tag-correction
  cancel-in-progress: false
jobs:
  correct:
    if: github.repository == 'layzerff/excalidraw'
    runs-on: ubuntu-latest
    steps:
      - name: Correct explicitly approved tag with expected SHA guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const base = 'https://api.github.com/repos/layzerff/excalidraw';
          const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
          const expected = '2b374d516957be1ed58a658c9936345120a1c059';
          const target = 'c15b4396b52e1566a4da2e3e047cff531b2c1075';
          async function request(path, options = {}) {
            const r = await fetch(base + path, {...options, headers});
            const body = await r.json();
            if (!r.ok) throw Error(r.status + ': ' + (body.message || 'GitHub request failed'));
            return body;
          }
          const current = await request('/git/ref/tags/v0.4.0');
          if (current.object.type !== 'commit') throw Error('Unexpected tag object type');
          if (current.object.sha === target) { console.log('Already correct'); process.exit(0); }
          if (current.object.sha !== expected) throw Error('Tag changed; refusing update');
          const file = await request('/contents/desktop/package.json?ref=' + target);
          if (JSON.parse(Buffer.from(file.content, 'base64').toString()).version !== '0.4.0') throw Error('Wrong source version');
          await request('/git/refs/tags/v0.4.0', {method:'PATCH', body:JSON.stringify({sha:target, force:true})});
          const verified = await request('/git/ref/tags/v0.4.0');
          if (verified.object.sha !== target) throw Error('Verification failed');
          console.log('Verified v0.4.0 -> ' + target);
          JS
